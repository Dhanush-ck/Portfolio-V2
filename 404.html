        <meta charset="UTF-8">

        <link rel="icon" href="./assets/img/icons/favicon.ico" type="image/x-icon">

        <!-- Preconnecting google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <!-- Importing fonts from google fonts -->
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

        <!-- css -->
        <style>
            /* Variables */
            :root{
                --void:#08080A;
                --amethyst:#8b5cf6;
                --orchid:#c084fc;
                --violet-mid:#6d28d9;
                --mist:#a5a5b3;
                --mist-dim:#6f6f7d;
                --line:rgba(255,255,255,.1);
                --glass:rgba(255,255,255,.05);
                --glass-strong:rgba(255,255,255,.07);
                --bg:#08080A;
                --surface:#12121A;
                --primary:#8B5CF6;
                --text:#F4F4F5;
                --text2:#A1A1AA;
                --border:rgba(255,255,255,.08);
                --primary-hover: #7c3aed;
                --glass-border: rgba(255, 255, 255, 0.08);
                --transition-smooth: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                --radius-sm:12px;
                --ease:cubic-bezier(.16,1,.3,1);
            }

            /* Reset */
            *{ 
                box-sizing:border-box; 
                margin:0; 
                padding:0; 
            }

            html,body{ height:100%; }

            body{
                background:var(--void);
                color:var(--text);
                font-family:'Inter', sans-serif;
                min-height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                overflow:hidden;
                position:relative;
            }

            /* Background glow effect */
            .glow-field{
                position:fixed;
                inset:0;
                background:
                    radial-gradient(60% 50% at 50% 38%, rgba(139,92,246,0.16), transparent 70%),
                    radial-gradient(40% 30% at 80% 80%, rgba(192,132,252,0.06), transparent 70%),
                    radial-gradient(40% 30% at 15% 75%, rgba(76,29,149,0.14), transparent 70%);
                pointer-events:none;
                display: n;
            }

            /* Drifting motes */
            .motes{ 
                position:fixed;
                inset:0;
                pointer-events:none; 
            }

            .mote{
                position:absolute;
                width:3px; height:3px;
                border-radius:50%;
                background:var(--orchid);
                opacity:0;
                box-shadow:0 0 6px 1px rgba(192,132,252,0.6);
                animation:drift linear infinite;
            }

            /* Drift animation */
            @keyframes drift{
                0%{ transform:translateY(0) translateX(0); opacity:0; }
                10%{ opacity:.7; }
                90%{ opacity:.4; }
                100%{ transform:translateY(-120vh) translateX(20px); opacity:0; }
            }

            /* Main section */
            .container{
                position:relative;
                z-index:2;
                display:flex;
                flex-direction:column;
                align-items:center;
                text-align:center;
                padding:48px 32px;
                max-width:560px;
            }

            .tear{
                position:relative;
                width:min(70vw, 320px);
                height:min(70vw, 320px);
                margin-bottom:12px;
                display:flex;
                align-items:center;
                justify-content:center;
            }

            .ring{
                position:absolute;
                border-radius:50%;
                border:1px solid var(--line);
            }

            .ring-1{ inset:0; animation:spin 40s linear infinite; }
            .ring-2{ inset:14%; border-color:rgba(139,92,246,0.25); animation:spin 30s linear infinite reverse; }

            /* Glow effect in the centre */
            .ring-3{
                inset:28%;
                border:none;
                background:radial-gradient(circle at 50% 50%, rgba(139,92,246,0.35), rgba(76,29,149,0.08) 60%, transparent 75%);
                filter:blur(2px);
                animation:pulse 5s var(--ease) infinite;
            }

            /* Rotating particle */
            .ring-1::before, .ring-2::before{
                content:"";
                position:absolute;
                width:6px; height:6px;
                border-radius:50%;
                background:var(--orchid);
                box-shadow:0 0 12px 3px rgba(192,132,252,0.8);
                top:-3px; left:50%;
                transform:translateX(-50%);
            }

            .ring-1::before {
                top: 99%;
            }

            /* Spin animation */
            @keyframes spin{ to{ transform:rotate(360deg); } }

            /* Pulse effect */
            @keyframes pulse{
            0%,100%{ opacity:.55; transform:scale(1); }
            50%{ opacity:.9; transform:scale(1.06); }
            }

            .code{
                position:relative;
                z-index:1;
                font-family:'Space Grotesk', serif;
                font-weight:600;
                font-size:clamp(64px, 14vw, 108px);
                line-height:1;
                letter-spacing:-0.02em;
                background:linear-gradient(160deg, var(--text) 0%, var(--orchid) 55%, var(--amethyst) 100%);
                -webkit-background-clip:text;
                background-clip:text;
                color:transparent;
            }

            h1.title{
                font-family:'Space Grotesk', serif;
                font-weight:500;
                font-size:clamp(22px, 3.4vw, 28px);
                letter-spacing:-0.01em;
                margin-top:8px;
                color:var(--text);
            }

            p.copy{
                margin-top:14px;
                color:var(--text2);
                font-size:15px;
                line-height:1.6;
                max-width:420px;
            }

            .actions{
                margin-top:34px;
                display:flex;
                gap:12px;
                flex-wrap:wrap;
                justify-content:center;
            }

            .btn{
                appearance:none;
                border:none;
                text-decoration:none;
                font-family:'Inter', sans-serif;
                font-size:14px;
                font-weight:600;
                letter-spacing:0.01em;
                padding:13px 24px;
                border-radius:50px;
                cursor:pointer;
                transition:var(--transition-smooth);
                display:inline-flex;
                align-items:center;
                gap:8px;
            }

            .btn-primary{
                background:linear-gradient(135deg, var(--amethyst), var(--violet-mid));
                color:#fff;
                box-shadow:0 8px 24px -8px rgba(139,92,246,0.55);
            }
            .btn-primary:hover{
                background:linear-gradient(135deg, var(--orchid), var(--primary-hover));
                transform:translateY(-1px);
                box-shadow:0 10px 28px -6px rgba(139,92,246,0.7);
            }

            .btn-ghost{
                background:var(--glass);
                color:var(--mist);
                border:1px solid var(--glass-border);
                backdrop-filter:blur(12px);
            }
            .btn-ghost:hover{
                background:var(--glass-strong);
                color:var(--text);
                border-color:rgba(139,92,246,0.4);
            }

            .btn:focus-visible{
                outline:2px solid var(--orchid);
                outline-offset:2px;
            }

            .path{
                margin-top:28px;
                font-family:'JetBrains Mono', monospace;
                font-size:12px;
                color:var(--mist-dim);
                background:var(--glass);
                border:1px solid var(--border);
                padding:6px 14px;
                border-radius:999px;
                letter-spacing:0.02em;
            }

            /* Responsive */
            @media (max-width:480px){
                .container{ padding:32px 20px; }

                .actions{ 
                    flex-direction:column; 
                    width:100%; 
                }

                .btn{ 
                    justify-content:center; 
                    width:100%; 
                }

                .btn-primary{ box-shadow:0 8px 14px -8px rgba(139,92,246,0.55); }
            }

            /* Reduced animation users */
            @media (prefers-reduced-motion: reduce){
                .ring--1, .ring--2, .ring--3, .mote{ animation:none !important; }
            }
        </style>
    </head>
    <body>

        <!-- Background effects -->
        <div class="glow-field"></div>
        <div class="motes" id="motes"></div>

        <main class="container">
            <div class="tear">
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <div class="code">404</div>
            </div>

            <h1 class="title">This page slipped through the tear</h1>
            <p class="copy">
                Nothing lives at this address. The link may be broken, moved, or it never
                existed on this side of the void.
            </p>

            <div class="actions">
                <a href="/" aria-label="Goto homepage" class="btn btn-primary">Return home</a>
                <a href="javascript:history.back()" aria-label="Goto previous page" class="btn btn-ghost">Go back</a>
            </div>

            <div class="path" id="path-display">/unknown-path</div>
        </main>

        <script>

            // Populate the requested path if available
            try {
                var p = window.location.pathname;
                if (p && p !== '/') {
                    document.getElementById('path-display').textContent = p;
                }
            } catch(e) {}

            // Generate ambient drifting motes
            (function(){
                var field = document.getElementById('motes');
                var count = window.innerWidth < 600 ? 12 : 22;
                for (var i = 0; i < count; i++){
                    var m = document.createElement('div');
                    m.className = 'mote';
                    var left = Math.random() * 100;
                    var delay = Math.random() * 12;
                    var dur = 10 + Math.random() * 10;
                    var bottom = Math.random() * 20;
                    m.style.left = left + 'vw';
                    m.style.bottom = bottom + 'vh';
                    m.style.animationDelay = delay + 's';
                    m.style.animationDuration = dur + 's';
                    m.style.opacity = '0';
                    field.appendChild(m);
                }
            })();

        </script>
    </body>
</html>
